baseURL = 'https://ac3ospades.github.io/'
locale = 'en-us'
title = 'andrew acciaioli'
theme = 'ananke'

[module]
[[module.imports]]
disable = false
ignoreConfig = false
ignoreImports = false
path = 'github.com/gohugo-ananke/ananke/v2'


# config/_default/params.toml

[ananke]
show_recent_posts = false # show recent posts on the homepage
show_categories = true # show categories terms on single pages
copy_code = true # show a copy-to-clipboard button on code blocks (progressive enhancement)

# config/_default/params.toml
[params]
recent_posts_number = 5
mainSections = ["posts"]
background_color_class = "bg-dark-gray"
body_classes = "avenir bg-near-white"
text_color = "dark-gray"
read_more_copy = "more"

[params.ananke.pages]
show_date = false

# config/_default/menus.toml

[[menus.main]]
name = "projects"
pageRef = "/projects/"
weight = 20

[[menus.main]]
name = "about"
pageRef = "/about/"
weight = 30

[caches]
  [caches.images]
    dir = ':cacheDir/images'  